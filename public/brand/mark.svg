<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Obsidian Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0B1226"/>
      <stop offset="100%" stop-color="#121D3B"/>
    </linearGradient>

    <!-- Electric Mint to High-Trust Emerald Gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="50%" stop-color="#00D287"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Titanium Platinum Horizon Gradient -->
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Sovereign Gold (Tara Star) Gradient -->
    <linearGradient id="taraGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="80%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>

    <!-- Rim Light Stroke Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#CA8A04" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Star Glow -->
    <filter id="starBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Executive Prism Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#rimGrad)" stroke-width="1.25"/>

  <!-- Subtle Micro-Grid Hairline Accent -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="12.5" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="0.75"/>

  <!-- Monogram F — Vertical Anchor Stem (Beveled & Polished) -->
  <g filter="url(#coreGlow)">
    <!-- Primary Vertical Pillar -->
    <path d="M16 15.5 C16 14.12 17.12 13 18.5 13 L23.5 13 C24.88 13 26 14.12 26 15.5 L26 48.5 C26 49.88 24.88 51 23.5 51 L18.5 51 C17.12 51 16 49.88 16 48.5 Z" fill="url(#titaniumGrad)"/>

    <!-- Top Horizontal Cantilever Beam with Dynamic 45-deg Bevel -->
    <path d="M24 13 L43 13 C44.66 13 46 14.34 46 16 L46 21 C46 22.66 44.66 24 43 24 L24 24 Z" fill="url(#titaniumGrad)"/>

    <!-- Middle Growth Vector Beam — Vibrant Mint Gradient -->
    <path d="M24 28 L37.5 28 C39.16 28 40.5 29.34 40.5 31 L40.5 35.5 C40.5 37.16 39.16 38.5 37.5 38.5 L24 38.5 Z" fill="url(#mintGrad)"/>

    <!-- Dynamic Upward Momentum Chevron Accent (Representing Velocity) -->
    <path d="M28.5 44 L34.5 38.5 L34.5 44 Z" fill="url(#mintGrad)" opacity="0.9"/>
  </g>

  <!-- Tara (Financial North Star) Apex Accent -->
  <g transform="translate(48.5, 16.5)" filter="url(#starBloom)">
    <!-- 8-Pointed Star -->
    <path d="M0 -7.5 L1.6 -2.2 L7 -0.5 L1.6 1.4 L0 7 L-1.6 1.4 L-7 -0.5 L-1.6 -2.2 Z" fill="url(#taraGold)"/>
    <circle cx="0" cy="0" r="1.3" fill="#FFFFFF"/>
  </g>
</svg>