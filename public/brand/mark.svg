<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded square tile in Midnight Ink -->
  <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="#101A3D"/>
  <!-- Geometric F with two horizontal bars stepping upward -->
  <!-- Vertical stem -->
  <rect x="16" y="14" width="6" height="36" rx="1" fill="#FFFFFF"/>
  <!-- Lower horizontal bar -->
  <rect x="16" y="34" width="22" height="5" rx="1" fill="#FFFFFF"/>
  <!-- Upper horizontal bar (steps up-right) -->
  <rect x="16" y="20" width="28" height="5" rx="1" fill="#FFFFFF"/>
  <!-- Four-point star (the tara) at tip of upper bar -->
  <g transform="translate(46, 22.5)">
    <path d="M0,-6 L1.5,-1.5 L6,0 L1.5,1.5 L0,6 L-1.5,1.5 L-6,0 L-1.5,-1.5 Z" fill="#E2A62B"/>
  </g>
</svg>
