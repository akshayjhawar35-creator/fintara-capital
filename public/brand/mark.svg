<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#162044"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Luxury Obsidian Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" stroke="rgba(212, 175, 55, 0.25)" stroke-width="1"/>

  <!-- Geometric Ascending Monogram "F" with Apex Star -->
  <!-- Vertical Pillar -->
  <path d="M16 15 C16 13.89 16.89 13 18 13 L21 13 C22.11 13 23 13.89 23 15 L23 49 C23 50.11 22.11 51 21 51 L18 51 C16.89 51 16 50.11 16 49 Z" fill="#FFFFFF"/>

  <!-- Upper Tier Bar -->
  <path d="M22 17 C22 15.89 22.89 15 24 15 L43 15 C44.11 15 45 15.89 45 17 L45 22 C45 23.11 44.11 24 43 24 L24 24 C22.89 24 22 23.11 22 22 Z" fill="#FFFFFF"/>

  <!-- Middle Growth Chevron Bar in Emerald -->
  <path d="M22 30 C22 28.89 22.89 28 24 28 L36 28 C37.11 28 38 28.89 38 30 L38 35 C38 36.11 37.11 37 36 37 L24 37 C22.89 37 22 36.11 22 35 Z" fill="url(#tealGrad)"/>

  <!-- Apex 4-Point Golden Star (Tara) -->
  <g transform="translate(48, 19.5)" filter="url(#glow)">
    <path d="M0 -7 L1.6 -1.8 L7 0 L1.6 1.8 L0 7 L-1.6 1.8 L-7 0 L-1.6 -1.8 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="1.2" fill="#FFFFFF"/>
  </g>
</svg>
