<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Obsidian Navy Shield Gradient -->
    <linearGradient id="obsidianGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E21"/>
      <stop offset="60%" stop-color="#0F1A3A"/>
      <stop offset="100%" stop-color="#16234B"/>
    </linearGradient>

    <!-- Sovereign Champagne Gold Gradient -->
    <linearGradient id="finGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="35%" stop-color="#F2CA52"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <!-- High-Impact Trust Emerald Gradient -->
    <linearGradient id="finEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Executive Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#obsidianGrad)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="url(#finGold)" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Subtle Inner Geometry Ring -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="12.5" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.08"/>

  <!-- Monogram F — Vertical Anchor Pillar -->
  <path d="M16 16 C16 14.895 16.895 14 18 14 L22 14 C23.105 14 24 14.895 24 16 L24 48 C24 49.105 23.105 50 22 50 L18 50 C16.895 50 16 49.105 16 48 Z" fill="#FFFFFF"/>

  <!-- Monogram F — Upper Horizon Arch -->
  <path d="M22 17 C22 15.343 23.343 14 25 14 L42 14 C43.657 14 45 15.343 45 17 L45 22 C45 23.657 43.657 25 42 25 L25 25 C23.343 25 22 23.657 22 22 Z" fill="#FFFFFF"/>

  <!-- Monogram F — Middle Accelerating Emerald Tier -->
  <path d="M22 29.5 C22 28.12 23.12 27 24.5 27 L36.5 27 C37.88 27 39 28.12 39 29.5 L39 34.5 C39 35.88 37.88 37 36.5 37 L24.5 37 C23.12 37 22 35.88 22 34.5 Z" fill="url(#finEmerald)"/>

  <!-- Tara (Guiding Star) Apex in Champagne Gold -->
  <g transform="translate(48, 18)" filter="url(#starGlow)">
    <!-- 8-Pointed Star -->
    <path d="M0 -8 L1.8 -2.2 L8 0 L1.8 2.2 L0 8 L-1.8 2.2 L-8 0 L-1.8 -2.2 Z" fill="url(#finGold)"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
