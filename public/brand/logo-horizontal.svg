<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" fill="none">
  <defs>
    <linearGradient id="hzObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E21"/>
      <stop offset="60%" stop-color="#0F1A3A"/>
      <stop offset="100%" stop-color="#16234B"/>
    </linearGradient>
    <linearGradient id="hzGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="hzEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="hzGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#hzObsidian)"/>
    <rect x="0.5" y="0.5" width="51" height="51" rx="13.5" stroke="url(#hzGold)" stroke-width="1" stroke-opacity="0.35"/>
    <path d="M14 13 C14 12 14.8 11 16 11 L19 11 C20.2 11 21 12 21 13 L21 39 C21 40 20.2 41 19 41 L16 41 C14.8 41 14 40 14 39 Z" fill="#FFFFFF"/>
    <path d="M19 14 C19 12.8 20 12 21.2 12 L35 12 C36.2 12 37.2 12.8 37.2 14 L37.2 19 C37.2 20.2 36.2 21 35 21 L21.2 21 C20 21 19 20.2 19 19 Z" fill="#FFFFFF"/>
    <path d="M19 25 C19 23.8 20 23 21.2 23 L31 23 C32.2 23 33.2 23.8 33.2 25 L33.2 29.5 C33.2 30.7 32.2 31.5 31 31.5 L21.2 31.5 C20 31.5 19 30.7 19 29.5 Z" fill="url(#hzEmerald)"/>
    <g transform="translate(40, 16)" filter="url(#hzGlow)">
      <path d="M0 -6 L1.4 -1.6 L6 0 L1.4 1.6 L0 6 L-1.4 1.6 L-6 0 L-1.4 -1.6 Z" fill="url(#hzGold)"/>
      <circle cx="0" cy="0" r="1.1" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Typography: Plus Jakarta Sans Look -->
  <text x="70" y="34" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="800" fill="#0A1128" letter-spacing="-0.6">Fintara</text>
  <text x="151" y="34" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="400" fill="#64748B" letter-spacing="-0.6">Capital</text>
  
  <text x="71" y="48" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0D9488" letter-spacing="1.5">LOAN ADVISORY &bull; PAN-INDIA</text>
</svg>
