<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="hzBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0B1226"/>
      <stop offset="100%" stop-color="#121D3B"/>
    </linearGradient>
    <linearGradient id="hzMintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="50%" stop-color="#00D287"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="hzTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="hzTaraGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FACC15"/>
      <stop offset="80%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="hzRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#CA8A04" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="hzGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#hzBgGrad)"/>
    <rect x="0" y="0" width="52" height="52" rx="14" stroke="url(#hzRim)" stroke-width="1.1"/>
    
    <!-- Monogram F -->
    <g filter="url(#hzGlow)">
      <path d="M14 13.5 C14 12.4 14.9 11.5 16 11.5 L20.5 11.5 C21.6 11.5 22.5 12.4 22.5 13.5 L22.5 39.5 C22.5 40.6 21.6 41.5 20.5 41.5 L16 41.5 C14.9 41.5 14 40.6 14 39.5 Z" fill="url(#hzTitanium)"/>
      <path d="M21 11.5 L36.5 11.5 C37.8 11.5 38.8 12.5 38.8 13.8 L38.8 18 C38.8 19.3 37.8 20.3 36.5 20.3 L21 20.3 Z" fill="url(#hzTitanium)"/>
      <path d="M21 23.8 L32 23.8 C33.3 23.8 34.3 24.8 34.3 26.1 L34.3 29.8 C34.3 31.1 33.3 32.1 32 32.1 L21 32.1 Z" fill="url(#hzMintGrad)"/>
      <path d="M24.5 36.5 L29.5 32 L29.5 36.5 Z" fill="url(#hzMintGrad)" opacity="0.85"/>
    </g>

    <!-- Tara Star -->
    <g transform="translate(40.5, 14.5)">
      <path d="M0 -6 L1.3 -1.8 L5.5 -0.4 L1.3 1.1 L0 5.5 L-1.3 1.1 L-5.5 -0.4 L-1.3 -1.8 Z" fill="url(#hzTaraGold)"/>
      <circle cx="0" cy="0" r="1.1" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Typography: High-Conviction FinTech Wordmark -->
  <text x="72" y="34" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#0A0F1D" letter-spacing="-0.8">Fintara</text>
  <text x="160" y="34" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#475569" letter-spacing="-0.6">Capital</text>

  <!-- Subtitle Tagline -->
  <text x="73" y="48" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#059669" letter-spacing="1.8">INSTITUTIONAL DEBT ADVISORY &bull; PAN-INDIA</text>
</svg>